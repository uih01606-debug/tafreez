<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كيف يعمل تفريز؟ | عرض 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one isometric 3D scene fills the screen; header on top, scene card with controls at the bottom,
   small HTML panels are pinned to 3D points (lab, gate, specialist, bars). Colours follow the TAFREEZ site. */
:root{
  --bg:#F4F7F6;--card:#FFFFFF;--ink:#142B27;--ink-2:#33504A;--muted:#64766F;--line:#E2E9E6;
  --emerald:#0F7B5F;--emerald-d:#0B5E49;--emerald-dd:#08473A;--emerald-t:#E5F3EE;
  --gold:#B28A3E;--gold-l:#D4B26A;--gold-t:#F8F1E3;--red:#B83A2E;--red-t:#FBECEA;--amber:#A86A12;--amber-t:#FCF2E1;--fifo:#A3AFAB;
  --font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --shadow:0 1px 2px rgba(20,43,39,.05),0 8px 24px rgba(20,43,39,.10);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none;cursor:grab}
#stage canvas:active{cursor:grabbing}
#pins{position:fixed;inset:0;pointer-events:none;overflow:hidden}

header{position:fixed;top:0;inset-inline:0;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 18px;background:var(--emerald-dd);color:#fff;z-index:5}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{margin:0;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:12px;color:#CFE6DE;font-weight:400}
.hbtns{display:flex;gap:8px;flex-shrink:0}
.hbtn{font:inherit;font-size:14px;font-weight:600;color:#fff;background:transparent;border:1px solid rgba(255,255,255,.45);
  border-radius:999px;padding:6px 14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.12)}
.strip{position:fixed;top:56px;inset-inline:0;margin:0;background:var(--gold-t);color:#6B5220;text-align:center;font-size:13px;font-weight:600;padding:5px 12px;z-index:4}

#banner{position:fixed;top:96px;left:50%;transform:translateX(-50%);z-index:4;max-width:calc(100% - 24px);
  background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 18px;font-size:15px;font-weight:600;
  box-shadow:var(--shadow);text-align:center;transition:opacity .4s;opacity:0}
#banner.on{opacity:1}
#banner.big{font-size:20px;padding:10px 24px;background:var(--emerald-dd);color:#fff;border-color:var(--emerald-dd)}
#banner.warn{background:var(--gold-t);color:#6B5220;border-color:var(--gold-l)}

#card{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:min(760px,calc(100% - 24px));z-index:5;
  background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 20px 14px;box-shadow:var(--shadow)}
#sn{margin:0;font-size:13px;font-weight:600;color:var(--emerald)}
#st{margin:2px 0 4px;font-size:22px;font-weight:700;line-height:1.35}
#sx{margin:0;font-size:16px;line-height:1.7;color:var(--ink-2)}
.row{display:flex;align-items:center;gap:8px;margin-top:12px}
.dots{display:flex;gap:6px;flex:1}
.dots button{width:10px;height:10px;padding:0;border-radius:50%;border:0;background:var(--line);cursor:pointer}
.dots button[aria-current="step"]{background:var(--emerald);width:28px;border-radius:10px}
.btn{font:inherit;font-size:15px;font-weight:600;border-radius:12px;padding:9px 18px;cursor:pointer;white-space:nowrap;
  border:1px solid var(--line);background:#fff;color:var(--ink)}
.btn:hover{background:var(--emerald-t)}
.btn.primary{background:var(--emerald);border-color:var(--emerald);color:#fff}
.btn.primary:hover{background:var(--emerald-d)}
.btn:disabled{opacity:.4;cursor:default;background:#fff}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold-l);outline-offset:2px}

/* pinned labels and panels */
.pin{position:absolute;left:0;top:0;transform:translate(-50%,-100%);opacity:0;visibility:hidden;transition:opacity .35s;white-space:nowrap}
.pin.on{opacity:1;visibility:visible}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--ink);box-shadow:0 2px 6px rgba(20,43,39,.08)}
.tag.crit{background:var(--red);border-color:var(--red);color:#fff}
.tag.em{background:var(--emerald-dd);border-color:var(--emerald-dd);color:#fff}
.tag.gold{background:var(--gold-t);border-color:var(--gold-l);color:#6B5220}
.tag.bad{background:var(--red-t);border-color:var(--red);color:var(--red)}
.tag.ok{background:var(--emerald-t);border-color:var(--emerald);color:var(--emerald-dd)}
.tag.lg{font-size:14px;padding:5px 12px}
.panel{pointer-events:auto;white-space:normal;width:250px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);font-size:13px;line-height:1.55}
.panel h3{margin:0 0 6px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.panel h3 .logo{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--emerald);color:#fff;font-size:12px}
.panel p{margin:4px 0}
.f{display:grid;grid-template-columns:1fr 70px 34px;align-items:center;gap:6px;margin:4px 0}
.f i{display:block;height:8px;border-radius:4px;background:var(--emerald)}
.f b{font-variant-numeric:tabular-nums;text-align:left;direction:ltr}
.rule{margin-top:8px;padding:6px 8px;border-radius:10px;background:var(--red-t);color:var(--red);font-weight:600}
.cmp{display:grid;grid-template-columns:96px 1fr;gap:6px;align-items:center;margin:5px 0}
.cmp i{display:block;height:10px;border-radius:5px;transition:width 1s ease}
.verdict{margin-top:6px;font-weight:700;color:var(--red)}
.chk{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:3px}
.chk li{display:flex;gap:8px;align-items:center}
.chk li span{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--line);color:#fff;font-size:11px;font-weight:700;flex-shrink:0}
.chk li.ok span{background:var(--emerald)}
.chk li.no span{background:var(--red)}
.chk li.no{color:var(--red);font-weight:700}
.reason{margin-top:6px;padding:6px 8px;border-radius:10px;font-weight:600}
.reason.no{background:var(--red-t);color:var(--red)}
.reason.ok{background:var(--emerald-t);color:var(--emerald-dd)}
.screen{width:290px}
.recbox{background:var(--emerald-t);border-radius:10px;padding:8px 10px;margin:6px 0}
.recbox b{display:block;font-size:15px;color:var(--emerald-dd)}
.acts{display:flex;gap:6px;margin-top:8px}
.acts .btn{font-size:14px;padding:7px 12px;flex:1}
.why{display:none;margin-top:8px}
.why.on{display:block}
.why select{width:100%;font:inherit;font-size:13px;padding:6px 8px;border-radius:10px;border:1px solid var(--line);margin-bottom:6px}
.log{display:none;margin-top:8px;padding:6px 8px;border-radius:10px;background:var(--emerald-t);color:var(--emerald-dd);font-weight:600}
.log.on{display:block}
.val{font-size:13px;font-weight:700;padding:2px 8px;border-radius:8px;background:#fff;border:1px solid var(--line);direction:ltr;font-variant-numeric:tabular-nums}
.val.t{background:var(--emerald);border-color:var(--emerald);color:#fff}
.glabel{font-size:13px;font-weight:700;color:var(--ink);background:rgba(255,255,255,.92);padding:4px 10px;border-radius:10px;text-align:center;line-height:1.4}
.glabel small{display:block;font-weight:600;font-size:12px}
.badge{font-size:20px;font-weight:700;color:#fff;background:var(--emerald);border-radius:14px;padding:6px 14px}
.legend{display:flex;gap:12px;font-size:13px;font-weight:600}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}

/* presentation mode */
body.present header,body.present .strip{display:none}
body.present #banner{top:16px}
body.present #card{width:min(980px,calc(100% - 32px))}
body.present #st{font-size:30px}
body.present #sx{font-size:20px}
body.present .panel{transform-origin:center bottom;font-size:15px;width:290px}
body.present .panel h3{font-size:17px}
body.present .screen{width:330px}
body.present .tag{font-size:14px}
body.present .glabel{font-size:15px}
.sm-only{display:none}
#exitPresent{display:none;position:fixed;top:16px;inset-inline-start:16px;z-index:6;color:var(--ink);border-color:var(--line);background:#fff}
body.present #exitPresent{display:inline-block}
/* large, readable from 1.5-2 m on a booth screen (desktop/TV) */
@media (min-width:1000px){
  .brand h1{font-size:22px}.brand small{font-size:14px}
  .hbtn{font-size:16px}.strip{font-size:15px}
  #banner{font-size:18px}#banner.big{font-size:26px;padding:12px 28px}
  #sn{font-size:17px}#st{font-size:34px}#sx{font-size:22px;line-height:1.6}
  .btn{font-size:18px;padding:11px 22px}.acts .btn{font-size:17px}
  .tag{font-size:17px;padding:5px 12px}.tag.lg{font-size:19px;padding:6px 14px}
  .panel{width:330px;font-size:17px;line-height:1.5;padding:14px 16px}.panel h3{font-size:20px}
  .panel h3 .logo{width:28px;height:28px;font-size:15px}
  .chk li span{width:22px;height:22px;font-size:13px}
  .recbox b{font-size:18px}.why select{font-size:16px}
  .val{font-size:16px}.glabel{font-size:18px}.glabel small{font-size:15px}
  .badge{font-size:26px;padding:8px 18px}.legend{font-size:17px}
  body.present #card{width:min(1240px,calc(100% - 40px))}
  body.present #st{font-size:42px}body.present #sx{font-size:27px}
  body.present .panel{font-size:19px;width:380px}body.present .panel h3{font-size:23px}
  body.present .screen{width:400px}
  body.present .tag{font-size:19px}body.present .glabel{font-size:21px}
  body.present .badge{font-size:30px}
}

@media (max-width:760px){
  header{padding:8px 12px}.brand h1{font-size:14px}.brand small{display:none}.brand svg{width:24px;height:24px}
  .lg-only{display:none}.sm-only{display:inline}
  .hbtn{font-size:12px;padding:5px 10px}
  .strip{top:48px;font-size:11px}
  #banner{top:80px;font-size:13px}#banner.big{font-size:15px}
  #card{padding:10px 12px;bottom:8px}
  #st{font-size:17px}#sx{font-size:13.5px;line-height:1.6}
  .row{flex-wrap:wrap}.dots{flex-basis:100%;justify-content:center;order:-1}.row .btn{flex:1;padding:8px 8px;font-size:14px}
  .panel{width:200px;font-size:11.5px;padding:8px 10px}.panel h3{font-size:13px}
  .screen{width:230px}
  .f{grid-template-columns:1fr 46px 30px}
  .cmp{grid-template-columns:80px 1fr}
  .tag{font-size:10.5px;padding:2px 6px}
  .glabel{font-size:11px}.badge{font-size:16px}
}
@media (prefers-reduced-motion:reduce){.pin,#banner,.cmp i{transition:none}}
</style>
</head>
<body>
<div id="stage" aria-label="مجسم ثلاثي الأبعاد يشرح طريقة عمل تفريز"></div>
<div id="pins"></div>

<header>
  <div class="brand">
    <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><rect width="32" height="32" rx="10" fill="#0F7B5F"/><path d="M9 11h14M9 16h10M9 21h6" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><circle cx="23" cy="21" r="2.6" fill="#D4B26A"/></svg>
    <div><h1>كيف يعمل تفريز؟ | عرض 3D</h1><small>دعم قرار قابل للتفسير لترتيب العينات الجنائية وقت الأزمات</small></div>
  </div>
  <div class="hbtns">
    <button class="hbtn" id="bFull"><span class="lg-only">عرض تقديمي بملء الشاشة</span><span class="sm-only">ملء الشاشة</span></button>
    <a class="hbtn" href="./"><span class="lg-only">الرجوع للموقع</span><span class="sm-only">الموقع</span></a>
  </div>
</header>
<p class="strip">نموذج أولي · بيانات محاكاة · قواعد مبرمجة، وليس نموذج ذكاء اصطناعي مدرّباً</p>
<button class="btn" id="exitPresent">خروج من العرض</button>
<div id="banner" role="status"></div>

<section id="card" aria-live="polite">
  <p id="sn"></p>
  <h2 id="st"></h2>
  <p id="sx"></p>
  <div class="row">
    <div class="dots" id="dots" role="group" aria-label="المشاهد"></div>
    <button class="btn" id="bReplay">إعادة العرض</button>
    <button class="btn" id="bPrev">السابق</button>
    <button class="btn primary" id="bNext">التالي</button>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
if(!window.THREE){document.getElementById('sx').textContent='تعذّر تحميل مكتبة العرض. تأكد من الاتصال بالإنترنت ثم حدّث الصفحة.';return;}

/* ---------- palette (from the TAFREEZ site) ---------- */
const P={bg:0xF4F7F6,white:0xFFFFFF,offwhite:0xFAFBFA,em:0x0F7B5F,emd:0x0B5E49,emdd:0x08473A,emt:0xE5F3EE,
  gold:0xB28A3E,goldl:0xD4B26A,red:0xB83A2E,amber:0xA86A12,fifo:0xA3AFAB,routine:0x7FB8A6,line:0xE2E9E6,skin:0xE9CDB0};
const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- renderer, scene, isometric camera ---------- */
const stage=$('stage'),pinsEl=$('pins');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(P.bg);
const camera=new THREE.OrthographicCamera(-10,10,10,-10,-200,400);
scene.add(new THREE.HemisphereLight(0xffffff,0xc9d8d3,.95));
const sun=new THREE.DirectionalLight(0xffffff,.55);sun.position.set(-18,34,22);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-34,right:34,top:30,bottom:-30,near:1,far:120});
sun.shadow.bias=-.0005;scene.add(sun);
const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.75,metalness:0},o||{}));
function box(w,h,d,c,x,y,z,o){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c,o));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m;}
function cyl(rt,rb,h,c,x,y,z,o){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,24),M(c,o));m.position.set(x,y,z);m.castShadow=true;scene.add(m);return m;}
const V=(x,y,z)=>new THREE.Vector3(x,y,z);

/* ---------- ground ---------- */
box(46,.6,32,P.white,2,-.3,0);
const edge=box(46.4,.25,32.4,P.emt,2,-.62,0);edge.castShadow=false;
// arrival lane
const lane=box(22,.06,1.6,P.emt,-12.5,.03,6);lane.castShadow=false;

/* ---------- main forensic lab (cut-away so the inside is visible) ---------- */
const LAB={x0:-14,x1:-1,z0:-7,z1:3};
box(13,.12,10,0xEEF5F2,-7.5,.06,-2);                          // floor
box(13,2.8,.35,P.white,-7.5,1.4,-7);                          // back wall
box(.35,2.8,10,P.white,-14,1.4,-2);                           // left wall
box(13.3,.18,.45,P.em,-7.5,2.88,-7);box(.45,.18,10.3,P.em,-14,2.88,-2); // green trim
box(9.4,.6,.3,P.white,-9.3,.3,3);box(.3,.6,4.2,P.white,-1,.3,-5);box(.3,.6,3,P.white,-1,.3,1.5); // low front/right walls (door gaps)
// benches, analyzers, analysts
const analyzers=[],analysts=[];
[-11,-7.5,-4].forEach((x,i)=>{
  box(2.8,1,1.3,P.emdd,x,.5,-5.2);
  const a=box(1.3,1.1,.9,P.white,x-.4,1.55,-5.3);
  const scr=new THREE.Mesh(new THREE.PlaneGeometry(.8,.45),M(P.em,{emissive:P.em,emissiveIntensity:.25}));scr.position.set(x-.4,1.7,-4.84);scene.add(scr);analyzers.push(scr);
  for(let k=0;k<2;k++)cyl(.12,.12,.45,P.fifo,x+.55+k*.35,1.22,-5.1);          // vials already being analysed
  const g=new THREE.Group();g.position.set(x,0,-3.4);
  const body=new THREE.Mesh(new THREE.CylinderGeometry(.38,.48,1.3,20),M(P.white));body.position.y=.65;body.castShadow=true;g.add(body);
  const coat=new THREE.Mesh(new THREE.CylinderGeometry(.4,.5,.25,20),M(P.em));coat.position.y=1.05;g.add(coat);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.32,20,20),M(P.skin));head.position.y=1.6;head.castShadow=true;g.add(head);
  scene.add(g);analysts.push(g);
});
// reagent shelf
box(.7,2,3.2,P.emd,-13.4,1,.6);
const bottles=[];[[-.6,.85,P.em],[.6,.7,P.em],[1.8,.22,P.amber]].forEach(([dz,lvl,c],i)=>{
  const z=-.4+i*1.0;cyl(.32,.32,1,0xffffff,-12.8,2.5,z,{transparent:true,opacity:.45});
  const f=cyl(.28,.28,1,c,-12.8,2.0+lvl/2,z);f.scale.y=lvl;bottles.push(f);
});
// sign on back wall
const signM=new THREE.Mesh(new THREE.PlaneGeometry(5,.9),M(P.emdd));signM.position.set(-7.5,3.5,-6.8);scene.add(signM);

/* ---------- partner labs ---------- */
function partner(cx,cz,low){
  box(6,2.2,4.4,P.white,cx,1.1,cz);box(6.3,.3,4.7,P.emd,cx,2.35,cz);
  for(let i=0;i<3;i++){const w=new THREE.Mesh(new THREE.PlaneGeometry(1.1,.7),M(0xCFE9E1,{emissive:P.emt,emissiveIntensity:.3}));w.position.set(cx-1.8+i*1.8,1.3,cz+2.21);scene.add(w);}
  cyl(.5,.5,1.8,0xffffff,cx+3.6,.9,cz+1.2,{transparent:true,opacity:.4});
  const f=cyl(.45,.45,1,low?P.amber:P.em,cx+3.6,.02+(low?.25:.75),cz+1.2);f.scale.y=low?.5:1.5;
}
const PA=V(15,0,-9.5),PB=V(16,0,1.5);partner(PA.x,PA.z,false);partner(PB.x,PB.z,true);

/* ---------- routing paths and evidence-safety gate ---------- */
const Y=.14;
const shared=new THREE.CatmullRomCurve3([V(-1.6,Y,6),V(.6,Y,4.6),V(1.8,Y,.2),V(4,Y,-2)]);
const brA=new THREE.CatmullRomCurve3([V(4,Y,-2),V(6.8,Y,-3),V(9.6,Y,-7.2),V(11.6,Y,-8.6)]);
const brB=new THREE.CatmullRomCurve3([V(4,Y,-2),V(7,Y,-1),V(10,Y,1.3),V(12.6,Y,1.5)]);
function tube(curve,c){const m=new THREE.Mesh(new THREE.TubeGeometry(curve,60,.13,8,false),M(c,{emissive:c,emissiveIntensity:0}));m.visible=false;scene.add(m);return m;}
const tShared=tube(shared,P.line),tA=tube(brA,P.line),tB=tube(brB,P.line);
const GATE=V(4,0,-2);
const gate=new THREE.Group();gate.position.copy(GATE);
const gm=M(P.gold,{metalness:.35,roughness:.4});
[-1.4,1.4].forEach(z=>{const p=new THREE.Mesh(new THREE.BoxGeometry(.3,2.6,.3),gm);p.position.set(0,1.3,z);p.castShadow=true;gate.add(p);});
const gbar=new THREE.Mesh(new THREE.BoxGeometry(.32,.32,3.1),gm);gbar.position.y=2.7;gbar.castShadow=true;gate.add(gbar);
const gLights=[];for(let i=0;i<6;i++){const s=new THREE.Mesh(new THREE.SphereGeometry(.17,14,14),M(0xC9D4D0));s.position.set(.22,2.7,-1.15+i*.46);gate.add(s);gLights.push(s);}
scene.add(gate);
// moving arrows along curves
function arrows(n,c){const a=[];for(let i=0;i<n;i++){const m=new THREE.Mesh(new THREE.ConeGeometry(.2,.5,12),M(c,{emissive:c,emissiveIntensity:.5}));m.visible=false;scene.add(m);a.push(m);}return a;}
const up=V(0,1,0);
function placeArrows(list,curve,el,speed,from,to){list.forEach((m,i)=>{const u=from+((((el*speed+i/list.length)%1)+1)%1)*(to-from);
  m.position.copy(curve.getPointAt(u));m.position.y=.45;const tg=curve.getTangentAt(u);m.quaternion.setFromUnitVectors(up,tg);});}

function ease(k){return k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;}
const tmp=V(0,0,0);
function anim(dt,now){
  const el=Math.max(0,(now-t0)/1000);
  // camera
  const kk=Math.min(1,dt*2.4);camT.lerp(camTw,kk);camR+= (camRw*zoomMul-camR)*kk;az+=(azW-az)*kk;
  const D=80;camera.position.set(camT.x+D*Math.cos(EL)*Math.sin(az),camT.y+D*Math.sin(EL),camT.z+D*Math.cos(EL)*Math.cos(az));camera.lookAt(camT);
  frustum();
  // samples motion
  samples.forEach(s=>{if(s.md>0){const k=Math.max(0,Math.min(1,(el-s.ms)/s.md));const e=ease(k);
    s.g.position.lerpVectors(s.from,s.to,e);s.g.position.y=s.arc*Math.sin(Math.PI*e);}});
  // critical samples glow
  samples.forEach(s=>{if(s.c)s.body.material.emissiveIntensity=cur>=1&&cur<=3?.18+.15*Math.sin(el*4):.15;});

  // scene-specific
  arrLane.forEach(a=>a.visible=cur<=1);if(cur<=1)placeArrows(arrLane,laneLine,el,.25,0,1);
  analysts.forEach((g,i)=>{g.position.y=cur===2?Math.abs(Math.sin(el*3+i))*.12:0;});
  analyzers.forEach((m,i)=>m.material.emissiveIntensity=cur===2?.35+.3*Math.sin(el*5+i):.25);
  bottles[2].material.emissive.setHex(cur===2?P.amber:0);bottles[2].material.emissiveIntensity=cur===2?.3+.3*Math.sin(el*5):0;

  if(cur===0){pFifo.on=el>1;const w=samples[7];pWait.pos.copy(w.g.position).add(V(0,1.9,0));pWait.on=el>3.6;
    samples.forEach((s,i)=>scoreTags[i].on=false);}
  if(cur===1){pTaf.on=el>.4;pFifo.on=el<2.2;pTafOrder.on=el>3.4;samples.forEach((s,i)=>scoreTags[i].on=el>1.2);}
  if(cur===2){pCap.on=true;pReag.on=el>2.6;pAnalysts.on=false;
    if(el>.6){$('barExp').style.width='100%';$('barDl').style.width='52%';}
    $('capV').style.opacity=el>1.8?1:0;scoreTags[7].on=true;}
  if(cur===3)routingAnim(el);
  if(cur===4){pScreen.on=true;pSpec.on=false;pA.on=true;pB.on=false;
    if(approved){const k=Math.min(1,(el-approveAt)/3);const tt=ease(k);
      const p=tt<.45?shared.getPointAt(tt/.45):brA.getPointAt((tt-.45)/.55);
      s001.g.position.set(p.x,0,p.z);s001.g.position.y=.15;if(k>=1)s001.g.visible=false;}
    arrShared.forEach(a=>a.visible=true);arrA.forEach(a=>a.visible=true);placeArrows(arrShared,shared,el,.35,0,1);placeArrows(arrA,brA,el,.35,0,1);}
  else if(cur!==3){arrShared.forEach(a=>a.visible=false);arrA.forEach(a=>a.visible=false);}
  if(cur===5){GROUPS.forEach((g,i)=>{const k=ease(Math.max(0,Math.min(1,(el-.3-i*.25)/1.2)));
      [[g.bf,g.f],[g.bt,g.t]].forEach(([b,v])=>{const h=Math.max(.001,v*g.scale*k);b.scale.y=h;b.position.y=h/2;});
      pG[i].lab.on=true;pG[i].vf.pos.set(g.x-.85,g.f*g.scale*k+.15,BZ);pG[i].vt.pos.set(g.x+.85,g.t*g.scale*k+.15,BZ);
      pG[i].vf.on=pG[i].vt.on=k>.95;});
    pBadge.on=el>2.2;pSlight.on=el>2.6;pLegend.on=el>.5;}
  // score tags follow samples
  samples.forEach((s,i)=>scoreTags[i].pos.copy(s.g.position).add(V(0,1.55,0)));
  if(cur>=2&&cur<=4){scoreTags.forEach((t,i)=>t.on=(cur<=3)||(i===7&&!approved));}
}

function light(i,ok){const l=gLights[i];l.material.color.setHex(ok?P.em:P.red);l.material.emissive.setHex(ok?P.em:P.red);l.material.emissiveIntensity=.7;

let gState='';
function routingAnim(el){
  pGate.on=el>.5;pA.on=true;pB.on=true;
  // phase B: pulse from queue to the gate, checks 1–2 pass, 3 (reagent) fails, path stops
  const tB0=.6,tChk=1.9,step=.45,tB1=tChk+3*step;
  // phase A: second candidate passes all six
  const tA0=tB1+1.4,tA1=tA0+6*step;
  let key;
  if(el<tA0){key='B';$('gWho').textContent='الفحص: مختبر شريك ب';}
  else {key='A';$('gWho').textContent='الفحص: مختبر شريك أ';}
  if(key!==gState){resetGate();gState=key;}
  if(key==='B'){
    if(el>=tB0&&el<tChk){pulse.visible=true;pulse.position.copy(shared.getPointAt(Math.min(1,(el-tB0)/(tChk-tB0))));pulse.position.y=.4;tShared.material.color.setHex(P.goldl);}
    const n=Math.floor((el-tChk)/step)+1;for(let i=0;i<Math.min(3,n);i++)light(i,i<2);
    if(el>=tB1){tB.material.color.setHex(P.red);stopX.visible=stopX2.visible=true;pulse.visible=false;
      const r=$('gReason');r.style.display='block';r.className='reason no';r.textContent='توقف المسار: شرط الكواشف لم يتحقق في مختبر ب';
      pB.d.firstChild.className='tag bad lg';pB.d.firstChild.textContent='مختبر شريك ب · الكواشف غير كافية';}
    else{pB.d.firstChild.className='tag lg';pB.d.firstChild.textContent='مختبر شريك ب';}
    pA.d.firstChild.className='tag lg';pA.d.firstChild.textContent='مختبر شريك أ';
  } else {
    tB.material.color.setHex(0xEBC9C4);stopX.visible=stopX2.visible=true;
    pB.d.firstChild.className='tag bad lg';pB.d.firstChild.textContent='مختبر شريك ب · الكواشف غير كافية';
    const n=Math.floor((el-tA0)/step)+1;for(let i=0;i<Math.min(6,n);i++)light(i,true);
    if(el>=tA1){[tShared,tA].forEach(t=>{t.material.color.setHex(P.em);t.material.emissive.setHex(P.em);t.material.emissiveIntensity=.35;});
      const r=$('gReason');r.style.display='block';r.className='reason ok';r.textContent='اجتاز الشروط الستة: يُقترح مختبر أ';
      pA.d.firstChild.className='tag ok lg';pA.d.firstChild.textContent='مختبر شريك أ · اجتاز البوابة';
      arrShared.forEach(a=>a.visible=true);arrA.forEach(a=>a.visible=true);placeArrows(arrShared,shared,el,.35,0,1);placeArrows(arrA,brA,el,.35,0,1);}
    else{arrShared.forEach(a=>a.visible=false);arrA.forEach(a=>a.visible=false);}
  }
  if(el<.05){gState='';}
}

/* decision buttons */
$('bOk').onclick=()=>{if(cur!==4)return;approved=true;approveAt=(performance.now()-t0)/1000;$('bOk').disabled=true;$('bEdit').disabled=true;$('why').classList.remove('on');
  const l=$('log');l.textContent='✓ تمت الموافقة، وانحفظ القرار في سجل القرارات';l.classList.add('on');};
$('bEdit').onclick=()=>{$('why').classList.toggle('on');};
$('bSave').onclick=()=>{$('bOk').disabled=true;$('bEdit').disabled=true;$('why').classList.remove('on');
  const l=$('log');l.textContent='✓ تم تسجيل التعديل وسببه: '+$('whySel').value+'. العينة تبقى في المختبر المحلي';l.classList.add('on');};

/* ---------- projection of pins ---------- */
const v=V(0,0,0);
function placePins(){const w=innerWidth,h=innerHeight;const bn=$('banner');const top=(document.body.classList.contains('present')?8:(w<760?80:96))+(bn.classList.contains('on')?bn.offsetHeight+8:0);
  const cardTop=$('card').getBoundingClientRect().top;
  pins.forEach(p=>{p.d.classList.toggle('on',p.on);if(!p.on)return;v.copy(p.pos).project(camera);
    let x=(v.x+1)/2*w,y=(1-v.y)/2*h;
    if(p.clamp){const ew=p.d.offsetWidth,eh=p.d.offsetHeight;x=Math.max(ew/2+8,Math.min(w-ew/2-8,x));y=Math.max(top+eh+4,Math.min(cardTop-8,y));}
    p.d.style.transform='translate('+(x|0)+'px,'+(y|0)+'px) translate(-50%,-100%)';});}

/* ---------- framing: fit each scene above the bottom card ---------- */
function frustum(){const w=innerWidth,h=innerHeight,asp=w/h;
  let r=camR;if(asp<1.35)r=camR*(asp<.8?.95:1.35)/asp;            // keep the scene's width on narrow screens
  const cardH=$('card').offsetHeight+24;const share=Math.min(.5,cardH/h);   // part of the screen covered by the card
  const half=r;const topH=half*(1-share*0.9),botH=half*(1+share*1.1);
  camera.left=-half*asp;camera.right=half*asp;camera.top=topH;camera.bottom=-botH;camera.updateProjectionMatrix();}
function resize(){renderer.setSize(innerWidth,innerHeight);frustum();}
addEventListener('resize',resize);

/* ---------- interaction: drag to turn, wheel/pinch to zoom ---------- */
let drag=null;const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,az:azW};cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(!drag)return;azW=Math.max(Math.PI/4-.7,Math.min(Math.PI/4+.7,drag.az-(e.clientX-drag.x)*.006));});
cv.addEventListener('pointerup',()=>drag=null);cv.addEventListener('pointercancel',()=>drag=null);
cv.addEventListener('wheel',e=>{e.preventDefault();zoomMul=Math.max(.6,Math.min(1.6,zoomMul*(e.deltaY>0?1.08:.93)));},{passive:false});

/* ---------- controls ---------- */
$('bNext').onclick=()=>go(cur===SC.length-1?0:cur+1);
$('bPrev').onclick=()=>go(cur-1);
$('bReplay').onclick=()=>{azW=Math.PI/4;go(0);};
function setPresent(on){document.body.classList.toggle('present',on);setTimeout(()=>{frustum();},60);}
$('bFull').onclick=()=>{setPresent(true);const d=document.documentElement;if(d.requestFullscreen)d.requestFullscreen().catch(()=>{});};
$('exitPresent').onclick=()=>{setPresent(false);if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen();};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)setPresent(false);});
addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;
  if(e.key==='ArrowLeft'||e.key===' '||e.key==='PageDown'){e.preventDefault();$('bNext').click();}
  else if(e.key==='ArrowRight'||e.key==='PageUp'){e.preventDefault();if(cur>0)go(cur-1);}
  else if(e.key==='f'||e.key==='F'){document.body.classList.contains('present')?$('exitPresent').click():$('bFull').click();}
  else if(e.key==='Home'){go(0);}});

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){now=performance.now();const dt=Math.min(.05,(now-last)/1000);last=now;anim(dt,now);renderer.render(scene,camera);placePins();requestAnimationFrame(loop);}
resize();go(0);requestAnimationFrame(loop);
})();
</script>
</body>
